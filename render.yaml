databases:
  - name: vocab-db
    databaseName: vocab
    user: vocab
    plan: free

services:
  - type: worker
    name: vocab-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: vocab-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: TZ_NAME
        value: Europe/Kyiv
      - key: AI_WEEKLY_LIMIT
        value: "5"
